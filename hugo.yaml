baseURL: https://akanreports.com/
locale: en-gh
title: Akan Reports
enableRobotsTXT: true
summaryLength: 32
disableKinds:
  - taxonomy
  - term

outputs:
  home:
    - html
    - json

permalinks:
  page:
    stories: /stories/:contentbasename/
  section:
    stories: /stories/

params:
  description: "Signals from Ghana's news cycle. Plus the world that shapes it."
  accraTimezone: Africa/Accra
  analytics:
    gaMeasurementId: G-0NCKKGH0QD

caches:
  images:
    dir: :cacheDir/images

markup:
  goldmark:
    renderer:
      unsafe: false
