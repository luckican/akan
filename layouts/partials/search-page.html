<section class="search-page">
    <div class="standard-shell">
        <p class="ds-kicker">Archive</p>
        <h1>Search Akan Reports</h1>
        <form class="search-form" role="search" onsubmit="return false">
            <label for="site-search">Search headlines, summaries, sections, and topics</label>
            <div><input id="site-search" type="search" autocomplete="off" placeholder="What are you looking for?"><button class="ds-button ds-button--solid" type="submit">Search</button></div>
        </form>
        <p class="search-status" id="search-status" aria-live="polite">Begin typing to search the reporting archive.</p>
        <div class="search-results" id="search-results"></div>
    </div>
</section>
